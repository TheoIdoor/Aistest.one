name: Build Minecraft 1.20.1 Forge Mod

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build Forge Mod JAR
        run: gradle build --no-daemon

      - name: Upload Finished Mod (.jar)
        uses: actions/upload-artifact@v4
        with:
          name: GeminiAiMod-1.20.1-Fertige-Jar
          path: build/libs/geminiaimod-1.20.1-1.0.0.jar
